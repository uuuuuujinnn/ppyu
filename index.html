<style>
/* 레이아웃: 휴대폰 한 화면 앱. 가운데 480px 기둥 + 아래 탭, 시트는 아래에서 올라옴 */
:root{
  /* Things 스타일: 연한 회청색 바탕 + 흰 카드 + 파란색 하나만 강조 */
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#303336; --ink2:#44474B; --sub:#55606E; --faint:#838B96;
  --line:#EEF1F4; --line2:#DFE3E8; --track:#E8ECF0; --field:#CBD2DA; --soft:#EEF2F6;
  --income:#D93B3B; --expense:#2576EB; --danger:#B42318; --warn-fg:#8A4B00; --warn-bg:#FFF4E5;
  --accent:#2576EB; --accent-soft:#EAF2FE; --on-accent:#FFFFFF; --card-shadow:0 2px 8px rgba(0,0,0,.05),0 0 2px rgba(0,0,0,.06);
  --on-ink:#FFFFFF; --scrim:rgba(48,51,54,.32);
  --p1:#0F766E; --p2:#C2410C; --p3:#6D28D9;
  --font:'Pretendard','Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1216; --surface:#191D23; --ink:#EEF1F4; --ink2:#D3D8DE; --sub:#9AA4B0; --faint:#7D8792;
  --line:#242931; --line2:#2E343D; --track:#232831; --field:#3A414B; --soft:#232831;
  --income:#F87171; --expense:#60A5FA; --danger:#F97066; --warn-fg:#FDBA74; --warn-bg:#3A2A14;
  --accent:#5C9CF5; --accent-soft:#1B2A40; --on-accent:#0F1216; --card-shadow:none;
  --on-ink:#0F1216; --scrim:rgba(0,0,0,.55); --p1:#2DD4BF; --p2:#FB923C; --p3:#A78BFA; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1216; --surface:#191D23; --ink:#EEF1F4; --ink2:#D3D8DE; --sub:#9AA4B0; --faint:#7D8792;
  --line:#242931; --line2:#2E343D; --track:#232831; --field:#3A414B; --soft:#232831;
  --income:#F87171; --expense:#60A5FA; --danger:#F97066; --warn-fg:#FDBA74; --warn-bg:#3A2A14;
  --accent:#5C9CF5; --accent-soft:#1B2A40; --on-accent:#0F1216; --card-shadow:none;
  --on-ink:#0F1216; --scrim:rgba(0,0,0,.55); --p1:#2DD4BF; --p2:#FB923C; --p3:#A78BFA; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--expense);outline-offset:2px}
/* 앱 틀을 화면에 고정: 브라우저 주소창이 접히거나 펴져도 바깥 페이지가 같이 밀리지 않게 */
html,body{overflow:hidden;overscroll-behavior:none}
#app{position:fixed;top:0;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 0 8px;min-height:56px}
h1{margin:0;font-size:22px;font-weight:700}
h2{margin:0;font-size:15px;font-weight:700}
.sub{color:var(--sub);font-size:13px}
.faint{color:var(--faint);font-size:13px}
.card{background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--card-shadow)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.btn{height:44px;border-radius:12px;border:1px solid var(--field);background:var(--surface);padding:0 14px;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.sm{height:36px;border-radius:10px;font-size:13px;padding:0 12px}
.btn.lg{height:52px;border-radius:14px;font-size:16px;font-weight:700}
.btn.ink{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:default}
.icon-btn{width:44px;height:44px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;border-radius:12px}
.seg{display:flex;background:var(--track);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;height:36px;border:0;border-radius:9px;background:transparent;color:var(--sub);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg.type button[data-v="i"][aria-pressed="true"]{background:var(--income);color:#fff}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:36px;border-radius:18px;border:1px solid var(--field);background:var(--surface);padding:0 12px 0 6px;display:inline-flex;align-items:center;gap:6px;font-size:13px}

.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.av{width:24px;height:24px;border-radius:12px;color:#fff;font-size:10px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;border:1.5px solid var(--surface)}
.av.lg{width:40px;height:40px;border-radius:20px;font-size:15px;border:0}
.av.xl{width:96px;height:96px;border-radius:48px;font-size:34px;border:0}
.av.ph{border-style:solid!important;border-color:var(--c)!important;border-width:2px!important}.av.ph.xl{border-width:3px!important}
.mcolors{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px 6px;width:100%;justify-items:center}
.mcolors button,.mc-pick{width:100%;max-width:34px;aspect-ratio:1;height:auto;border-radius:50%;border:0;padding:0;cursor:pointer}
.mc-pick{position:relative;display:inline-flex;align-items:center;justify-content:center;color:#fff;background:conic-gradient(#ef4444,#f59e0b,#84cc16,#06b6d4,#6366f1,#d946ef,#ef4444)}
.mc-pick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.av.s{width:18px;height:18px;border-radius:9px;font-size:9px}
.avs{display:inline-flex}.ic .avs .av{position:static;width:16px;height:16px;font-size:8px;border-width:1.5px}.ic .avs .av+.av{margin-left:-6px}.otag{width:29px;flex-shrink:0;display:inline-flex}.avs .av+.av{margin-left:-7px}
.amt-i{color:var(--income)}.amt-e{color:var(--expense)}.amt-x{color:var(--sub)}
.period{display:flex;align-items:center;justify-content:center;gap:4px;padding:4px 0 12px}
.period .label{font-size:17px;font-weight:700;min-width:140px;text-align:center;border:0;background:transparent;color:var(--ink);font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:40px;border-radius:10px;cursor:pointer;padding:0 8px}
.period .label svg{color:var(--sub)}
.rp-btn{width:40px;height:40px;flex-shrink:0;border-radius:10px;border:1px solid var(--field);background:var(--surface);color:var(--sub);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.rp-card .field{border-bottom:0}
.rp-btn.hd{width:44px;height:44px;border:0;background:transparent;color:var(--ink);border-radius:12px}
.rp-btn.hd[aria-pressed=true]{background:var(--accent-soft);color:var(--accent)}
.rp-btn.sg{height:auto;align-self:stretch;width:48px;border:0;background:var(--track);border-radius:12px}
.rp-btn.sg[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.rp-btn[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.rp-line{display:flex;align-items:center;gap:6px;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--accent);font:inherit;font-size:13px;font-weight:600;padding:0 0 12px;margin-top:-4px;text-align:left}
.field:has(+ .rp-line){border-bottom:0}
.dt-pill{position:relative;flex:1;min-width:0;height:40px;border:1px solid var(--field);border-radius:10px;background:var(--surface);display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--ink);cursor:pointer;white-space:nowrap;overflow:hidden}
.dt-pill svg{color:var(--sub);flex-shrink:0}

.pill.tm{width:68px;flex-shrink:0;height:40px;text-align:center;padding:0 4px}
.rp-mark{display:inline-flex;vertical-align:-1px;margin-left:5px;color:var(--faint)}
.rp-row{display:flex;align-items:center;gap:12px;width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:12px 0;text-align:left;color:inherit;font:inherit;cursor:pointer}

.mp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

.bd-card,.bd-empty{width:100%;border:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.bd-empty{gap:10px;padding:14px 16px;color:var(--ink)}
.bd-bar{display:flex;height:10px;border-radius:5px;background:var(--track);overflow:hidden;gap:0}
.bd-bar span{height:100%}
.fx-rules{margin:0;padding:0 4px 0 22px;display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:1.55;color:var(--sub)}
.fx-rules b{color:var(--ink);font-weight:600}
.cur-pill{display:inline-flex;align-items:center;gap:2px;height:30px;padding:0 8px 0 10px;border-radius:15px;border:1px solid var(--field);background:var(--surface);color:var(--sub);font:inherit;font-size:13px;font-weight:600;cursor:pointer;flex-shrink:0;margin-left:6px}
.rq-grid{display:grid;gap:6px}
.rq-grid button{height:38px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font:inherit;font-size:14px;cursor:pointer;padding:0}
.rq-grid button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}

.rq-label{font-size:16px;display:flex;align-items:center;gap:6px}

.rq-wd{display:flex;justify-content:space-between}
.rq-wd button{width:38px;height:38px;border-radius:50%;border:1px solid transparent;background:transparent;font-size:15px;color:var(--ink);cursor:pointer;padding:0}
.rq-wd button[aria-pressed=true]{border-color:var(--accent);color:var(--accent) !important;font-weight:700;background:var(--accent-soft)}
.rq-pill{width:100%;min-height:44px;border-radius:22px;border:1px solid var(--line2);background:var(--surface);color:var(--sub);font:inherit;font-size:15px;cursor:pointer;padding:0 18px}
.rq-pill[aria-pressed=true]{border:2px solid var(--accent);color:var(--accent);font-weight:700}
.rp-tabs button{font-size:14px;padding:0 2px}
.rp-sec{background:var(--soft);border-radius:14px;padding:14px 16px}
.rp-radio{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;border:0;border-bottom:1px solid var(--line2);background:transparent;color:var(--ink);font:inherit;font-size:15px;padding:0;text-align:left;cursor:pointer}
.rp-radio:last-child{border-bottom:0}
.rp-radio .rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--faint);flex-shrink:0;box-sizing:border-box}
.rp-radio[aria-pressed=true] .rd{border:6px solid var(--accent)}
.rp-radio input{height:36px}
.rp-grid button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;padding:4px 2px}
.rp-grid button b{font-weight:600;font-size:14px}
.rp-grid button small{font-size:12px;opacity:.75}
.mp-grid button .dot{position:absolute;left:50%;bottom:7px;width:4px;height:4px;margin-left:-2px;border-radius:2px;background:currentColor;opacity:.5}

.xp-row input{flex:1;min-width:0}
.cf-ok{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:700}
.tag{font-size:12px;color:var(--sub);border:1px solid var(--line2);border-radius:6px;padding:0 5px;margin-left:2px;font-weight:400}

.crop-hint{font-size:13px;color:rgba(255,255,255,.75);line-height:1.5;max-width:300px}

.crop-zoom{width:min(300px,100%);accent-color:var(--accent)}
.crop .btn{min-height:46px}
.crop .btn:not(.ink){background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.25)}
.statrow{border:0;background:transparent;width:100%;text-align:left;padding:6px 0;min-height:40px;gap:8px;color:inherit;font:inherit;cursor:pointer;border-radius:8px}
.statrow.sm{min-height:34px;padding:2px 0}
.statrow:disabled{cursor:default}
.statrow svg{color:var(--faint)}
.day.sel{color:var(--ink);font-weight:700}
.day.sel span:first-child{background:var(--soft);border-radius:8px;padding:2px 8px;margin-left:-8px}
/* 달력 칸 금액은 줄 맞출 필요가 없어서 숫자 폭을 글자마다 다르게 (1 앞이 벌어져 보이지 않게) */
.calc{font-variant-numeric:proportional-nums;letter-spacing:0!important}
input[type="date"],input[type="time"]{min-width:0;font-size:14px}
.calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.calw{text-align:center;font-size:12px;color:var(--sub);padding:4px 0 6px}

.calc[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 1.5px var(--accent)}
.calnum{font-size:13px;font-weight:500;width:24px;height:24px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:1px}

  if (!e.name.trim()) { toast('이름을 적어 주세요.'); return; }
  if (!e.gid) { toast('분류를 골라 주세요.'); return; }

  const o = { id: e.id, name: e.name.trim(), owner: e.owner, gid: e.gid, kind: e.kind, hidden: !!e.hidden, init: e.init || 0 };
  if (CUR[e.cur]) o.cur = e.cur;

document.addEventListener('input', (ev) => {
  const el = ev.target; const act = el.dataset && el.dataset.act; if (!act) return;

  if (act === 'ed-time') { const v = fmtTime(el.value, false); if (v !== el.value) el.value = v; return; }

  if (act === 'mem-f') { S.memEd.n = el.value; return; }

  if (act === 'sq') { S.search.q = el.value; clearTimeout(S._sq); S._sq = setTimeout(refreshSearch, 250); return; }
  if (act === 'sf' && (el.dataset.k === 'min' || el.dataset.k === 'max')) { S.search[el.dataset.k] = el.value.replace(/\D/g, ''); clearTimeout(S._sq); S._sq = setTimeout(refreshSearch, 300); }
});
document.addEventListener('change', (ev) => {
